name: golangci-lint
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install templ
        shell: bash
        # Pinned to the templ runtime version in go.mod: newer generators
        # emit code (e.g. templ.ResolveAttributeValue) the pinned runtime
        # does not have, which breaks the build.
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Run templ generate
        shell: bash
        run: templ generate -path .
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2