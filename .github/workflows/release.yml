name: goreleaser

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install templ
        shell: bash
        # Pinned to the templ runtime version in go.mod: newer generators
        # emit code (e.g. templ.ResolveAttributeValue) the pinned runtime
        # does not have, which breaks the build.
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Run templ generate
        shell: bash
        run: templ generate -path .

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ env.GITHUB_REF_NAME }}
          args: release --clean
          workdir: ./
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
